title = "Gitleaks Configuration"

[extend]
useDefault = true

[allowlist]
description = "Global allowlist"
paths = [
  '''testdata''',
  '''tests/''',
  '''\.zig-cache''',
  '''zig-out''',
  '''vendor''',
]
regexTarget = "match"
regexes = [
  # TSIG/security code patterns - narrow allowlist to protocol identifiers
  '''TSIG''',                                # TSIG protocol references
  '''HMAC''',                                # HMAC algorithm names
  '''hmac_sha\d+''',                         # HMAC algorithm enum values
  '''hmac_md5''',                            # MD5 algorithm enum value
  '''TsigKey''',                             # TSIG key type name
  '''Sig0KeyPair''',                         # SIG(0) key type name
  # EDNS cookie patterns
  '''computeClientCookie''',                 # DNS cookie computation
  '''Cookie\.''',                            # Cookie struct methods
  '''SipHash''',                             # SipHash for cookie computation
]
