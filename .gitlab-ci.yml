---
# GitLab CI/CD Pipeline for dns
# SPDX-License-Identifier: Apache-2.0

default:
  interruptible: true
  tags:
    - company
    # The shared "company" tag also matches the Hosted Windows Runners, whose
    # PowerShell shell executor cannot run these bash job scripts. Pin to the
    # Linux fleet (OVH / Lab Servers / Company Cluster all carry "linux").
    - linux
    - x86

include:
  # Security scanning
  - component: gitlab.com/devnw/ci-catalog/security-gitleaks@aad997d40e358eeef7ec943f761498341c37c724
    inputs:
      tags: ["company", "linux", "x86"]

  # Code quality
  - component: gitlab.com/devnw/ci-catalog/zig-format@aad997d40e358eeef7ec943f761498341c37c724
    inputs:
      tags: ["company", "linux", "x86"]

  # SBOM
  - component: gitlab.com/devnw/ci-catalog/sbom-generate@aad997d40e358eeef7ec943f761498341c37c724
    inputs:
      tags: ["company", "linux", "x86"]
  - component: gitlab.com/devnw/ci-catalog/sbom-scan@aad997d40e358eeef7ec943f761498341c37c724
    inputs:
      tags: ["company", "linux", "x86"]

  # Release
  - component: gitlab.com/devnw/ci-catalog/release-semantic@aad997d40e358eeef7ec943f761498341c37c724
    inputs:
      tags: ["company", "linux", "x86"]
      release_auth: job_token
  - component: gitlab.com/devnw/ci-catalog/zig-version-tag-check@aad997d40e358eeef7ec943f761498341c37c724
    inputs:
      tags: ["company", "linux", "x86"]

variables:
  ZIG_VERSION: "0.16.0"

cache:
  key: "${CI_COMMIT_REF_SLUG}"
  paths:
    - .zig-cache/

stages:
  - lint
  - build
  - test
  - fuzz
  - security
  - sbom
  - release

# Zig installation template (SEC-R6-02: SHA-256 verified via ziglang.org index)
.install-zig: &install-zig
  - apt-get update && apt-get install -y curl xz-utils python3
  - |
    if [ ! -f "zig-${ZIG_VERSION}/zig" ]; then
      ARCH=$(uname -m)
      case "$ARCH" in
        x86_64)  ZIG_ARCH="x86_64" ;;
        aarch64) ZIG_ARCH="aarch64" ;;
        arm64)   ZIG_ARCH="aarch64" ;;
        *)       echo "Unsupported architecture: $ARCH"; exit 1 ;;
      esac
      MAJOR=$(echo "$ZIG_VERSION" | cut -d. -f1)
      MINOR=$(echo "$ZIG_VERSION" | cut -d. -f2)
      if [ "$MAJOR" -eq 0 ] && [ "$MINOR" -lt 15 ]; then
        ARCHIVE_NAME="zig-linux-${ZIG_ARCH}-${ZIG_VERSION}"
      else
        ARCHIVE_NAME="zig-${ZIG_ARCH}-linux-${ZIG_VERSION}"
      fi
      TARBALL="${ARCHIVE_NAME}.tar.xz"
      INDEX_FILE=$(mktemp)
      curl -fsSL "https://ziglang.org/download/index.json" -o "${INDEX_FILE}"
      EXPECTED_HASH=$(ZIG_VER="${ZIG_VERSION}" ZIG_ARCH_KEY="${ZIG_ARCH}-linux" ZIG_IDX="${INDEX_FILE}" \
        python3 -c "
    import json, os, sys
    idx = json.load(open(os.environ['ZIG_IDX']))
    pkg = idx.get(os.environ['ZIG_VER'], {}).get(os.environ['ZIG_ARCH_KEY'], {})
    h = pkg.get('shasum', '')
    if not h: sys.exit('SHA-256 not found for ' + os.environ['ZIG_VER'] + '/' + os.environ['ZIG_ARCH_KEY'])
    print(h)
    ")
      rm -f "${INDEX_FILE}"
      curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/${TARBALL}" -o "${TARBALL}"
      echo "${EXPECTED_HASH}  ${TARBALL}" | sha256sum --check --strict
      tar -xJf "${TARBALL}"
      mv "${ARCHIVE_NAME}" "zig-${ZIG_VERSION}"
      rm -f "${TARBALL}"
    fi
  - export PATH="$PWD/zig-${ZIG_VERSION}:$PATH"
  - zig version

# Override zig-format component to use the project's ZIG_VERSION
# and explicitly check all source directories.
# The v1.2.1 component defaults to 0.14.0 and does not accept a version input.
zig-format:
  variables:
    ZIG_VERSION: "0.16.0"
  before_script:
    - *install-zig
  script:
    - zig fmt --check src/ cmd/ build.zig tests/ examples/ benchmarks/

# Build job
build:
  stage: build
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - zig build

# Unit tests
test:
  stage: test
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - zig build test --summary all
  needs:
    - build

# Release optimization tests
test-release-safe:
  stage: test
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - zig build test -Doptimize=ReleaseSafe --summary all
  needs:
    - build

# ReleaseFast tests
test-release-fast:
  stage: test
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - zig build test -Doptimize=ReleaseFast --summary all
  needs:
    - build

# ReleaseSmall tests
test-release-small:
  stage: test
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - zig build test -Doptimize=ReleaseSmall --summary all
  needs:
    - build

# Examples build verification
build-examples:
  stage: build
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - zig build examples
  needs: []

# Coverage-guided fuzz testing.
# Runs with a 60-second timeout so the job always terminates.
#
# Exit-code semantics:
#   rc=0  : fuzzer stopped cleanly before timeout (no crash)
#   rc=124: timeout reached (expected in CI) - pass
#   other : fuzzer found a crash - fail the job
fuzz:
  stage: fuzz
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - timeout 60 zig build test --fuzz; rc=$?; if [ $rc -ne 0 ] && [ $rc -ne 124 ]; then exit $rc; fi
  artifacts:
    when: on_failure
    paths:
      - zig-out/fuzz/
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true
  allow_failure: true
  needs:
    - build

# -----------------------------------------------------------------------------
# FIPS / PQC dual-mode gate (spec section 7: BOTH -Dfips=false and -Dfips=true
# must be green).
#
# Provision the reviewed OpenSSL 3.6.5 release using the vendored installer.
# Require authenticity against pinned official signing fingerprints; a system
# OpenSSL installation or a moving upstream release cannot choose CI's version.
# The provider and tests run in the same job and project-relative prefix.
test-fips:
  stage: test
  image: debian:bookworm-slim
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends build-essential perl curl wget sudo gnupg xz-utils python3 ca-certificates
    - *install-zig
    - wget -q https://www.openssl-library.org/source/pubkeys.asc -O /tmp/openssl-pubkeys.asc
    - gpg --batch --import /tmp/openssl-pubkeys.asc
    - OPENSSL_PREFIX="$CI_PROJECT_DIR/.openssl-fips" OPENSSL_VERSION="3.6.5" REQUIRE_GPG=1 bash scripts/install-openssl-fips.sh
  script:
    - export OPENSSL_CONF="$CI_PROJECT_DIR/.openssl-fips/ssl/openssl.cnf"
    - make test-dual OPENSSL_PREFIX="$CI_PROJECT_DIR/.openssl-fips"
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  needs:
    - build

# Real primary/subkey signatures pass; tampering and untrusted keys fail closed.
fips-release-signature:
  stage: lint
  image: debian:bookworm-slim
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends python3 gnupg
  script:
    - python3 scripts/test_release_signature.py

# Disable merge_request_event pipelines. Jobs without rules never run in MR
# pipelines, so the few MR-ruled jobs fail on `needs:` of jobs that are not
# there ("error on the CI/CD configuration file"), and that failed MR pipeline
# becomes the head pipeline that blocks auto-merge. Branch pipelines carry the
# real jobs; evaluate those. (Same fix as devnw/zig/uuid fc0d25fd.)
workflow:
  auto_cancel:
    on_job_failure: all
    on_new_commit: interruptible
  rules:
    - if: '$CI_COMMIT_TAG'
      auto_cancel:
        on_new_commit: none
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    # SRE-194: validation pipelines fail fast on the first blocking job failure;
    # these rules admit only what the next rule already admits.
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      auto_cancel:
        on_job_failure: all
    - when: always

# SONNY-4778: tools must not redirect Git operations into this worktree.
hook-env-regression:
  stage: lint
  image: python:3.15-slim-bookworm
  tags: [company, linux, x86]
  before_script:
    - apt-get update -qq && apt-get install -y --no-install-recommends git
  script:
    - python3 scripts/test_hook_env.py

test-source-package:
  stage: test
  image: debian:trixie-slim@sha256:62bd423aeee912639ca8ee681c2b762cb3e25137e0a92b20be455898a9f034ad
  tags: [company, linux, x86]
  before_script:
    - *install-zig
    - apt-get install -y --no-install-recommends git
  script:
    - python3 scripts/check_source_package.py --jobs 2
  needs:
    - build
  allow_failure: false

# Exercise OS entropy natively: cross-compilation cannot detect a wrong syscall.
test-portable-entropy-macos:
  stage: test
  tags: [dedicated, macos, arm]
  timeout: 10m
  interruptible: true
  needs: []
  cache:
    key: "zig-${ZIG_VERSION}-macos-aarch64"
    paths:
      - zig-${ZIG_VERSION}/
  before_script:
    - |
      if [ ! -x "zig-${ZIG_VERSION}/zig" ] || [ "$(zig-${ZIG_VERSION}/zig version)" != "$ZIG_VERSION" ]; then
        ARCH=$(uname -m)
        case "$(uname -s)" in
          Linux) ZIG_OS=linux ;;
          Darwin) ZIG_OS=macos ;;
          *) echo "Unsupported operating system"; exit 1 ;;
        esac
        case "$ARCH" in
          x86_64)  ZIG_ARCH="x86_64" ;;
          aarch64) ZIG_ARCH="aarch64" ;;
          arm64)   ZIG_ARCH="aarch64" ;;
          *)       echo "Unsupported architecture: $ARCH"; exit 1 ;;
        esac
        MAJOR=$(echo "$ZIG_VERSION" | cut -d. -f1)
        MINOR=$(echo "$ZIG_VERSION" | cut -d. -f2)
        if [ "$MAJOR" -eq 0 ] && [ "$MINOR" -lt 15 ]; then
          ARCHIVE_NAME="zig-${ZIG_OS}-${ZIG_ARCH}-${ZIG_VERSION}"
        else
          ARCHIVE_NAME="zig-${ZIG_ARCH}-${ZIG_OS}-${ZIG_VERSION}"
        fi
        TARBALL="${ARCHIVE_NAME}.tar.xz"
        INDEX_FILE=$(mktemp)
        curl -fsSL "https://ziglang.org/download/index.json" -o "${INDEX_FILE}"
        EXPECTED_HASH=$(ZIG_VER="${ZIG_VERSION}" ZIG_ARCH_KEY="${ZIG_ARCH}-${ZIG_OS}" ZIG_IDX="${INDEX_FILE}" \
          python3 -c "
      import json, os, sys
      idx = json.load(open(os.environ['ZIG_IDX']))
      pkg = idx.get(os.environ['ZIG_VER'], {}).get(os.environ['ZIG_ARCH_KEY'], {})
      h = pkg.get('shasum', '')
      if not h: sys.exit('SHA-256 not found for ' + os.environ['ZIG_VER'] + '/' + os.environ['ZIG_ARCH_KEY'])
      print(h)
      ")
        rm -f "${INDEX_FILE}"
        curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/${TARBALL}" -o "${TARBALL}"
        ZIG_ARCHIVE="${TARBALL}" ZIG_SHA256="${EXPECTED_HASH}" python3 -c 'import hashlib, os; p=os.environ["ZIG_ARCHIVE"]; actual=hashlib.sha256(open(p, "rb").read()).hexdigest(); assert actual == os.environ["ZIG_SHA256"], "Zig archive checksum mismatch"'
        tar -xJf "${TARBALL}"
        rm -rf "zig-${ZIG_VERSION}"
        mv "${ARCHIVE_NAME}" "zig-${ZIG_VERSION}"
        rm -f "${TARBALL}"
      fi
    - export PATH="$PWD/zig-${ZIG_VERSION}:$PATH"
    - zig version
  script:
    - zig test -lc --dep std_shim -Mroot=tests/portable_entropy_test.zig -Mstd_shim=src/std_shim.zig
  rules:
    # This project validates branches; workflow intentionally excludes MR pipelines.
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'
