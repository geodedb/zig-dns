#
# Build, test, and security scanning are enabled.

include:
  # Security scanning (Advanced SAST enabled by default)
  - component: gitlab.com/devnw/ci-catalog/security-sast@v1.7.1
    inputs:
      stage: security
  - component: gitlab.com/devnw/ci-catalog/security-dependency-scanning@v1.7.1
    inputs:
      stage: security
  - component: gitlab.com/devnw/ci-catalog/security-secrets@v1.7.1
    inputs:
      stage: security
  - component: gitlab.com/devnw/ci-catalog/security-gitleaks@v1.7.1

  # SBOM generation and scanning
  - component: gitlab.com/devnw/ci-catalog/sbom-generate@v1.7.1
  - component: gitlab.com/devnw/ci-catalog/sbom-scan@v1.7.1

  # Release creation
  - component: gitlab.com/devnw/ci-catalog/release-semantic@v1.7.1
    inputs:
      stage: release

default:
  tags:
    - company
    - linux

stages:
  - build
  - test
  - security
  - sbom
  - release

# SEC-GAP-058: Pin Docker images by digest (CWE-829)
# Image digests should be verified and updated regularly
# To find digest: docker pull ziglang/zig:0.15.1 && docker inspect --format='{{.RepoDigests}}' ziglang/zig:0.15.1
# Example pinned format: ziglang/zig:0.15.1@sha256:abc123...

build:
  stage: build
  # TODO: Replace with pinned digest - ziglang/zig@sha256:<digest>
  # Current tag-based image (not pinned, security risk)
  image: ziglang/zig:0.15.1
  script:
    - zig version
    - zig build
  artifacts:
    when: always
    paths:
      - zig-out/
      - zig-cache/

test:
  stage: test
  # TODO: Replace with pinned digest - ziglang/zig@sha256:<digest>
  # Current tag-based image (not pinned, security risk)
  image: ziglang/zig:0.15.1
  script:
    - zig version
    - zig build test --summary all
